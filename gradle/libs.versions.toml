[versions]
agp = "8.13.2"
kotlin = "2.4.10"
junit = "5.11.3"
serialization = "1.9.0"

[libraries]
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }
zxing-javase = { module = "com.google.zxing:javase", version = "3.5.3" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version = "1.3.4" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.3.4" }
camerax-view = { module = "androidx.camera:camera-view", version = "1.3.4" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.9.3" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
